from pathlib import Path

# ============================================================
# THIPKE / ACTIVITY SVG GENERATOR
# Creates 10 separate SVG files directly in:
# assets/svg/
# ============================================================

OUTPUT_DIR = Path(r"C:\Users\saksh\Downloads\marathi_mulakshare\assets\svg")
OUTPUT_DIR.mkdir(parents=True, exist_ok=True)


def save_svg(number, content):
    file_path = OUTPUT_DIR / f"thipke_{number}.svg"

    svg = f'''<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="500"
     viewBox="0 0 500 500">

{content}

</svg>
'''

    file_path.write_text(svg, encoding="utf-8")
    print(f"✅ Created: {file_path}")


# ============================================================
# 1 - DOTS JOIN : STRAIGHT LINE
# ============================================================

save_svg(1, r'''
<g fill="white" stroke="black" stroke-width="4">
